<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171C24"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  <!-- Eye-line band -->
  <rect x="72" y="214" width="368" height="84" rx="18" fill="rgba(245,158,11,0.14)" stroke="rgba(245,158,11,0.45)" stroke-width="3"/>
  <!-- Left & right broadcast chevrons -->
  <polygon points="88,236 116,256 88,276" fill="#F59E0B"/>
  <polygon points="424,236 396,256 424,276" fill="#F59E0B"/>
  <!-- Stylized teleprompter text lines -->
  <rect x="148" y="136" width="216" height="24" rx="12" fill="#64748B" opacity="0.55"/>
  <rect x="136" y="242" width="240" height="28" rx="14" fill="url(#amber)"/>
  <rect x="158" y="346" width="196" height="24" rx="12" fill="#E2E8F0" opacity="0.85"/>
  <!-- On-air tally dot -->
  <circle cx="404" cy="108" r="18" fill="#EF4444"/>
</svg>
